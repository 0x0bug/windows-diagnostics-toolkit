name: PowerShell Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\scripts\validate.ps1

      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate.ps1

      - name: Test findings with PowerShell 7
        shell: pwsh
        run: .\tests\report-common.tests.ps1

      - name: Test findings with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\report-common.tests.ps1

      - name: Test diagnostic data with PowerShell 7
        shell: pwsh
        run: .\tests\diagnostic-data.tests.ps1

      - name: Test diagnostic data with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\diagnostic-data.tests.ps1

      - name: Test Privacy Mode with PowerShell 7
        shell: pwsh
        run: .\tests\privacy-mode.tests.ps1

      - name: Test snapshots with PowerShell 7
        shell: pwsh
        run: .\tests\snapshot.tests.ps1

      - name: Test snapshots with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\snapshot.tests.ps1

      - name: Test snapshot comparison with PowerShell 7
        shell: pwsh
        run: .\tests\snapshot-compare.tests.ps1

      - name: Test snapshot comparison with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\snapshot-compare.tests.ps1

      - name: Test incident investigation with PowerShell 7
        shell: pwsh
        run: .\tests\incident.tests.ps1

      - name: Test incident investigation with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\incident.tests.ps1

      - name: Test Privacy Mode with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\privacy-mode.tests.ps1

      - name: Test Security Posture with PowerShell 7
        shell: pwsh
        run: .\tests\security-posture.tests.ps1

      - name: Test Security Posture with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\security-posture.tests.ps1

      - name: Test Performance Snapshot with PowerShell 7
        shell: pwsh
        run: .\tests\performance-snapshot.tests.ps1

      - name: Test Performance Snapshot with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\performance-snapshot.tests.ps1

      - name: Test Crash and Hang Diagnostics with PowerShell 7
        shell: pwsh
        run: .\tests\crash-hang-diagnostics.tests.ps1

      - name: Test Crash and Hang Diagnostics with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\crash-hang-diagnostics.tests.ps1

      - name: Test Time Sync Diagnostics with PowerShell 7
        shell: pwsh
        run: .\tests\time-sync-diagnostics.tests.ps1

      - name: Test Time Sync Diagnostics with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\time-sync-diagnostics.tests.ps1

      - name: Test validation AST policy with PowerShell 7
        shell: pwsh
        run: .\tests\validate-ast.tests.ps1

      - name: Test validation AST policy with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\validate-ast.tests.ps1

      - name: Test interactive TUI with PowerShell 7
        shell: pwsh
        run: .\tests\tui.tests.ps1

      - name: Test interactive TUI with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\tui.tests.ps1

      - name: Test live report smoke with PowerShell 7
        shell: pwsh
        run: .\tests\report-smoke.tests.ps1

      - name: Test live report smoke with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\report-smoke.tests.ps1

      - name: Test README launches with PowerShell 7
        shell: pwsh
        run: .\tests\readme.tests.ps1

      - name: Test README launches with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\readme.tests.ps1

      - name: Test Network Context with PowerShell 7
        shell: pwsh
        run: .\tests\network-context.tests.ps1

      - name: Test Network Context with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\network-context.tests.ps1

      - name: Test module registry with PowerShell 7
        shell: pwsh
        run: .\tests\module-registry.tests.ps1

      - name: Test module registry with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\module-registry.tests.ps1

      - name: Test module compatibility with PowerShell 7
        shell: pwsh
        run: .\tests\module-compatibility.tests.ps1

      - name: Test module compatibility with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\module-compatibility.tests.ps1

      - name: Test module parsers with PowerShell 7
        shell: pwsh
        run: .\tests\module-parser.tests.ps1

      - name: Test module parsers with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\module-parser.tests.ps1

      - name: Test diagnostic classification with PowerShell 7
        shell: pwsh
        run: .\tests\diagnostic-classification.tests.ps1

      - name: Test diagnostic classification with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\diagnostic-classification.tests.ps1

      - name: Test process runner with PowerShell 7
        shell: pwsh
        run: .\tests\process-runner.tests.ps1

      - name: Test process runner with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\process-runner.tests.ps1

      - name: Test startup inventory with PowerShell 7
        shell: pwsh
        run: .\tests\startup-inventory.tests.ps1

      - name: Test startup inventory with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\startup-inventory.tests.ps1

      - name: Test bootstrap synchronization with PowerShell 7
        shell: pwsh
        run: .\tests\bootstrap-sync.tests.ps1

      - name: Test bootstrap synchronization with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\bootstrap-sync.tests.ps1

      - name: Test release delivery with PowerShell 7
        shell: pwsh
        run: .\tests\release.tests.ps1

      - name: Test release delivery with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\release.tests.ps1

      - name: Smoke test System report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path -Path $env:RUNNER_TEMP -ChildPath ('wdt-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          .\Invoke-WindowsDiagnostics.ps1 -System -OutputDirectory $outputDirectory

          $reports = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'WindowsDiagnosticsReport-*.txt' -File)
          if ($reports.Count -lt 1) {
            throw 'Smoke test did not create a TXT report.'
          }

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: wdt-prerelease-publication
      cancel-in-progress: false

    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check unpublished version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$') { throw 'Only prerelease versions can be published.' }
          $tag = 'v' + $version
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not list published releases.' }
          $releases = @($releasesJson | ConvertFrom-Json | ForEach-Object { $_ } | ForEach-Object { $_ })
          if (@($releases | Where-Object { $_.tag_name -ceq $tag }).Count -gt 0) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Host "Preserving existing release $tag."
          }
          else {
            $refsJson = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release tags.' }
            if (@($refsJson | ConvertFrom-Json | Where-Object { $_.ref -ceq "refs/tags/$tag" }).Count -gt 0) { throw 'An unpublished tag already exists; inspect it before creating a release.' }
            if (-not (Test-Path -LiteralPath "docs/releases/$version.md" -PathType Leaf)) { throw 'Release notes are missing.' }
            'publish=true' >> $env:GITHUB_OUTPUT
          }

      - name: Build release ZIP and checksum
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Verify actual package with PowerShell 7
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          .\tests\release-package.tests.ps1 -ArchivePath "dist/windows-diagnostics-toolkit-v$version.zip" -SourceRoot $PWD.Path

      - name: Verify actual package with Windows PowerShell 5.1
        if: steps.release.outputs.publish == 'true'
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          .\tests\release-package.tests.ps1 -ArchivePath "dist/windows-diagnostics-toolkit-v$version.zip" -SourceRoot $PWD.Path

      - name: Publish prerelease and verify uploaded assets
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $tag = 'v' + $version
          $archiveName = "windows-diagnostics-toolkit-v$version.zip"
          $archivePath = Join-Path dist $archiveName
          $checksumPath = "$archivePath.sha256"
          $expectedHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesPath = Join-Path $env:RUNNER_TEMP 'wdt-release-notes.md'
          $notes = (Get-Content -LiteralPath "docs/releases/$version.md" -Raw) + "`n## Release integrity`n`nSHA-256 ($archiveName): $expectedHash`n`nSource commit: $env:GITHUB_SHA`n"
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release create $tag $archivePath $checksumPath --target $env:GITHUB_SHA --prerelease --title "Windows Diagnostics Toolkit $tag" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Prerelease publication failed.' }
          $downloadDirectory = Join-Path $env:RUNNER_TEMP ('wdt-published-' + [guid]::NewGuid().ToString('N'))
          try {
            gh release download $tag --pattern $archiveName --pattern "$archiveName.sha256" --dir $downloadDirectory
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the published assets for verification.' }
            if ((Get-FileHash -LiteralPath (Join-Path $downloadDirectory $archiveName) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) { throw 'Published ZIP differs from the tested package.' }
            if ((Get-FileHash -LiteralPath (Join-Path $downloadDirectory "$archiveName.sha256") -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $checksumPath -Algorithm SHA256).Hash) { throw 'Published checksum file differs from the tested file.' }
          }
          finally {
            if (Test-Path -LiteralPath $downloadDirectory) { Remove-Item -LiteralPath $downloadDirectory -Recurse -Force }
          }
          "Published $tag from $env:GITHUB_SHA; SHA-256: $expectedHash" >> $env:GITHUB_STEP_SUMMARY
